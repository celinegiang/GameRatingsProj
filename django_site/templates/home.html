<!DOCTYPE html>
<html>
<head><title>Home Baseline</title></head>
<body>
    <h1>GameRatingsProj Backend Test Home</h1>
    {% if user.is_authenticated %}
        <p>Welcome back, <strong>{{ user.username }}</strong>!</p>
        
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit" style="background:none; border:none; color:blue; text-decoration:underline; cursor:pointer; padding:0;">
                Log Out
            </button>
        </form>
        
    {% else %}
        <p>You are logged out.</p>
        <p><a href="{% url 'login' %}">Log In Here</a></p>
        <p>New player? <a href="{% url 'signup' %}">Create an Account Here</a></p>
    {% endif %}
</body>
</html>

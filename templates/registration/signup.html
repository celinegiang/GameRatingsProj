<!DOCTYPE html>
<html>
<head><title>Sign Up</title></head>
<body>
    <h2>Create Your Game Account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register Account</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log In Here</a></p>
</body>
</html>
